quarkus.topaz.devservices.policy.directory=classpath:topaz/policies
quarkus.topaz.devservices.manifest-location=classpath:topaz/manifest.yaml
quarkus.topaz.devservices.data-location=classpath:topaz/data
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users."rick@the-citadel.com"=rick
quarkus.security.users.embedded.users."morty@the-citadel.com"=morty
quarkus.security.users.embedded.users."summer@the-citadel.com"=summer
quarkus.topaz.enforcement.policy-root=todoApp
quarkus.http.auth.permission.secured.paths=/secured/*
quarkus.http.auth.permission.secured.policy=topaz
quarkus.http.auth.permission.secured.applies-to=jaxrs
# The todo app's other endpoints are secured by the topaz policy, not by FGA annotations
quarkus.zanzibar.filter.deny-unannotated-resource-methods=false
